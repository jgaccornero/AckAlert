
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AckAlert</title>
<style>
body{font-family:Arial,sans-serif;background:#101827;color:white;margin:0;padding:20px}
main{max-width:600px;margin:auto}
h1{color:#60a5fa}
section{background:#1e293b;padding:18px;border-radius:14px;margin:16px 0}
input,button{box-sizing:border-box;width:100%;padding:13px;margin:7px 0;border-radius:9px;font-size:16px}
input{background:#fff;color:#111;border:0}
button{background:#3b82f6;color:white;border:0;font-weight:bold}
.ack{background:#16a34a}
.item{border-bottom:1px solid #475569;padding:12px 0}
small{color:#cbd5e1}
</style>
</head>
<body>
<main>
<h1>🔔 AckAlert</h1>
<p>Reminders that require acknowledgment.</p>
<section>
<h2>Create Reminder</h2>
<input id="message" placeholder="What should I remind you?">
<input id="when" type="datetime-local">
<button onclick="addReminder()">Add Reminder</button>
</section>
<section>
<h2>Pending Alerts</h2>
<div id="pending"></div>
</section>
<section>
<h2>Acknowledged History</h2>
<div id="history"></div>
</section>
</main>
<script>
let alerts=JSON.parse(localStorage.getItem("ackalerts")||"[]");
function save(){
 localStorage.setItem("ackalerts",JSON.stringify(alerts));
 render();
}
function addReminder(){
 const message=document.getElementById("message").value.trim();
 const when=document.getElementById("when").value;
 if(!message||!when){alert("Enter a reminder and time.");return;}
 if(new Date(when).getTime()<=Date.now()){
  alert("Choose a future time.");return;
 }
 alerts.push({id:Date.now(),message,when,ack:false});
 document.getElementById("message").value="";
 document.getElementById("when").value="";
 save();
}
function acknowledge(id){
 const item=alerts.find(a=>a.id===id);
 if(item){item.ack=true;item.ackTime=new Date().toLocaleString();save();}
}
function render(){
 const pending=document.getElementById("pending");
 const history=document.getElementById("history");
 pending.innerHTML="";
 history.innerHTML="";
 alerts.forEach(a=>{
  const div=document.createElement("div");
  div.className="item";
  const title=document.createElement("strong");
  title.textContent=a.message;
  div.appendChild(title);
  const info=document.createElement("p");
  info.textContent=a.ack
   ?"Acknowledged: "+a.ackTime
   :"Scheduled: "+new Date(a.when).toLocaleString();
  div.appendChild(info);
  if(!a.ack){
   const btn=document.createElement("button");
   btn.className="ack";
   btn.textContent="✓ Acknowledge";
   btn.onclick=()=>acknowledge(a.id);
   div.appendChild(btn);
  }
  (a.ack?history:pending).appendChild(div);
 });
 if(!pending.children.length)pending.textContent="No pending alerts.";
 if(!history.children.length)history.textContent="No history yet.";
}
render();
</script>
</body>
</html>
